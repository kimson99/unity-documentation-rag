services:
  postgres:
    build:
      context: .                  
      dockerfile: postgres.Dockerfile
    ports:
      - 15432:5432
    command: >
      postgres
      -c shared_preload_libraries='pg_stat_statements,pg_partman_bgw'
    volumes:
      - ./postgres-data:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_PASSWORD: 12345678
  redis:
    image: redis:8-alpine
    ports:
      - 16379:6379
    volumes:
      - ./redis-data:/data
    environment:
      REDIS_HOST_PASSWORD: 12345678 
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - 5540:5540
    volumes:
      - ./redis-insight-data:/data